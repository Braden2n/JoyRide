name: Resolve PR conflicts

# Dispatched by Sync PR branches for each conflicting PR, or run by hand from the Actions tab.
# claude-code-action does not accept push events, so this runs on workflow_dispatch.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
        type: number

concurrency:
  group: resolve-pr-${{ inputs.pr }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Find the PR branch
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: echo "ref=$(gh api "repos/$REPO/pulls/$PR" --jq .head.ref)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.head.outputs.ref }}
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Sync PR branches dispatches this workflow as github-actions.
          allowed_bots: "github-actions,github-actions[bot]"
          prompt: |
            Branch `${{ steps.head.outputs.ref }}` (PR #${{ inputs.pr }}) conflicts with main. Bring it up to date.

            1. Read CLAUDE.md.
            2. Run `git fetch origin main` and `git merge origin/main`.
            3. Resolve each conflict by keeping main's content and re-applying only this branch's intended change.
            4. If this branch adds an ID (DEC, ICD, or any other) whose number main already uses, renumber it to the next free number. Rename the file and update every reference: its front matter, H1, the decision log, stage tables, and links.
            5. Renumber open-item tables so they have no gaps.
            6. Check that no conflict markers remain and that `git diff origin/main` shows only this branch's change.
            7. Commit the merge with a message that lists any renumbering, then run `git push origin HEAD:${{ steps.head.outputs.ref }}`. Never force-push or rebase.
            8. Only after the push succeeds, comment on PR #${{ inputs.pr }} with the pushed commit SHA and what you resolved and renumbered. Link files with absolute URLs that start with https://github.com/Braden2n/JoyRide/blob/main/.

            Run one command per Bash call, without `&&` or pipes. If a command is denied or the push fails, comment on the PR with the exact error instead of claiming success, and stop.
            If a conflict needs a builder decision, push nothing. Comment on the PR with the question and stop.
          claude_args: |
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh api:*)"
            --disallowedTools "Bash(git push --force:*),Bash(git push -f:*),Bash(git push --force-with-lease:*),Bash(git rebase:*),Bash(git reset:*),Bash(git rm:*),Bash(git clean:*),Bash(git branch -D:*),Bash(git branch -d:*)"

      - name: Show permission denials
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          LOG: ${{ steps.claude.outputs.execution_file }}
        run: jq -c '.[] | select(.type == "result") | .permission_denials[]? | {tool_name, tool_input}' "$LOG" || true

      - name: Check that the branch now contains main
        env:
          REF: ${{ steps.head.outputs.ref }}
        run: |
          git fetch -q origin main "$REF"
          if git merge-base --is-ancestor origin/main "origin/$REF"; then
            echo "origin/$REF contains main."
          else
            echo "::error::origin/$REF still does not contain main. Nothing was pushed."
            exit 1
          fi
