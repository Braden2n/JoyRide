name: Sync PR branches

# Keeps open PR branches current with main. Clean branches get GitHub's update-branch
# merge; each conflicting branch gets a Resolve PR conflicts run.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Merge main into open PR branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          prs=$(gh pr list --repo "$REPO" --base main --state open --json number,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | .number')
          for n in $prs; do
            if out=$(gh api -X PUT "repos/$REPO/pulls/$n/update-branch" 2>&1); then
              echo "#$n updated"
            elif echo "$out" | grep -qi conflict; then
              echo "#$n has conflicts; dispatching Resolve PR conflicts"
              gh workflow run resolve-pr.yml --repo "$REPO" --ref main -f pr="$n"
            else
              echo "#$n skipped: $out"
            fi
          done
